# Local stack (README "Run the stack"). Copy .env.example to .env first;
# every variable has a default, so `docker compose up` also works without one.
#
#   docker compose up --build -d --wait
#   node scripts/smoke.mjs
#
# Then open http://localhost:${WEB_PORT:-8080}.
#
# The database and the server are published on 127.0.0.1 only: the server
# tests (`#[sqlx::test]`) use the database, and the web app's dev server
# proxies /api to the server. The `test` profile adds `server-tests`.

name: taskmint

# Every long-running service: a read-only root filesystem, no Linux
# capabilities, no privilege gain, and logs that rotate.
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-server-image: &server-image
  image: taskmint-server:local
  build:
    context: .
    dockerfile: apps/server/Dockerfile

x-database-url: &database-url
  DATABASE_URL: postgres://taskmint:${POSTGRES_PASSWORD:-taskmint}@db:5432/taskmint

services:
  db:
    <<: *hardened
    image: postgres:18-alpine
    # The image's postgres user from the start, so the entrypoint needs no
    # capabilities to hand the data folder over
    user: "70:70"
    environment:
      POSTGRES_USER: taskmint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskmint}
      POSTGRES_DB: taskmint
    volumes:
      # PG18 keeps PGDATA in a versioned folder under this path.
      - db-data:/var/lib/postgresql
    tmpfs:
      - /var/run/postgresql:uid=70,gid=70
      - /tmp
    networks: [backend]
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmint -d taskmint"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 1g
    # A process per connection
    pids_limit: 256
    restart: unless-stopped

  migrate:
    <<: [*server-image, *hardened]
    command: ["migrate"]
    environment:
      <<: *database-url
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    # The image's HEALTHCHECK is for `serve`; this one runs and exits.
    healthcheck:
      disable: true
    mem_limit: 256m
    pids_limit: 64
    restart: "no"

  server:
    <<: [*server-image, *hardened]
    command: ["serve"]
    environment:
      <<: *database-url
      TASKMINT_BIND: 0.0.0.0:3000
      TASKMINT_PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      TASKMINT_COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # The web app's nginx is in front, and adds the client's address
      TASKMINT_TRUST_PROXY: ${TRUST_PROXY:-true}
      TASKMINT_ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      TASKMINT_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      RUST_LOG: ${RUST_LOG:-info}
      TASKMINT_LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend, frontend]
    expose:
      - "3000"
    ports:
      # Loopback only: the web app's dev server proxies /api here.
      - "127.0.0.1:${SERVER_PORT:-3000}:3000"
    # Password hashes take 19 MiB each, one per CPU at a time
    mem_limit: 512m
    pids_limit: 256
    restart: unless-stopped

  web:
    <<: *hardened
    image: taskmint-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    environment:
      TASKMINT_SERVER: http://server:3000
    depends_on:
      server:
        condition: service_healthy
    # The server only: the web app can't reach the database
    networks: [frontend]
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    # nginx (uid 101) writes its rendered config and temp files
    tmpfs:
      - /etc/nginx/conf.d:uid=101,gid=101
      - /tmp:uid=101,gid=101
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped

  # The server's gates in Linux (scripts/check-server.sh): its query
  # metadata, and its tests at 100% coverage against `db`, as CI runs them.
  #
  #   docker compose --profile test run --rm --build server-tests
  #
  # The first run builds everything; the volumes keep the build for the next.
  server-tests:
    profiles: [test]
    image: taskmint-server-tests:local
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: test
    environment:
      <<: *database-url
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    volumes:
      - server-tests-target:/src/target
      - server-tests-registry:/usr/local/cargo/registry
    # Cargo writes its home and target, so the root filesystem stays writable
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  # The database and what uses it
  backend:
  # The web app and the server it passes /api to
  frontend:

volumes:
  db-data:
  server-tests-target:
  server-tests-registry:
