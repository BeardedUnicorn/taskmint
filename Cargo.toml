[workspace]
resolver = "2"
members = ["crates/taskmint-core", "apps/desktop/src-tauri", "apps/server"]
# The desktop crate needs WebKitGTK on Linux, so plain `cargo` commands at the
# root leave it out; `--workspace` or `-p taskmint` includes it.
default-members = ["crates/taskmint-core", "apps/server"]

# Password hashing is far too slow unoptimized; tests and dev builds hash a lot.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
