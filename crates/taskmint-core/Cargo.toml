[package]
name = "taskmint-core"
version = "1.0.0"
description = "TaskMint's business rules, shared by the desktop app and the server"
authors = ["Mike Herold"]
edition = "2021"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
# Recomputing the extension ID from apps/extension/manifest.json
base64 = "0.22"
sha2 = "0.10"
