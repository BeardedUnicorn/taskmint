# taskmint-core is pure: no clock reads and no filesystem access. Hosts pass
# `now` in and do the I/O themselves. (Clippy paths take no globs, so every
# std::fs function is listed, and the fs types are banned outright.)
disallowed-methods = [
    { path = "chrono::Utc::now", reason = "core never reads the clock; take `now` as a parameter" },
    { path = "chrono::Local::now", reason = "core never reads the clock; take `now` as a parameter" },
    { path = "std::time::SystemTime::now", reason = "core never reads the clock; take `now` as a parameter" },
    { path = "std::time::Instant::now", reason = "core never reads the clock; take `now` as a parameter" },
    { path = "std::fs::canonicalize", reason = "core does no I/O; the host reads and writes files" },
    { path = "std::fs::copy", reason = "core does no I/O; the host reads and writes files" },
    { path = "std::fs::create_dir", reason = "core does no I/O; the host reads and writes files" },
    { path = "std::fs::create_dir_all", reason = "core does no I/O; the host reads and writes files" },
    { path = "std::fs::exists", reason = "core does no I/O; the host reads and writes files" },
    { path = "std::fs::hard_link", reason = "core does no I/O; the host reads and writes files" },
    { path = "std::fs::metadata", reason = "core does no I/O; the host reads and writes files" },
    { path = "std::fs::read", reason = "core does no I/O; the host reads and writes files" },
    { path = "std::fs::read_dir", reason = "core does no I/O; the host reads and writes files" },
    { path = "std::fs::read_link", reason = "core does no I/O; the host reads and writes files" },
    { path = "std::fs::read_to_string", reason = "core does no I/O; the host reads and writes files" },
    { path = "std::fs::remove_dir", reason = "core does no I/O; the host reads and writes files" },
    { path = "std::fs::remove_dir_all", reason = "core does no I/O; the host reads and writes files" },
    { path = "std::fs::remove_file", reason = "core does no I/O; the host reads and writes files" },
    { path = "std::fs::rename", reason = "core does no I/O; the host reads and writes files" },
    { path = "std::fs::set_permissions", reason = "core does no I/O; the host reads and writes files" },
    { path = "std::fs::soft_link", reason = "core does no I/O; the host reads and writes files" },
    { path = "std::fs::symlink_metadata", reason = "core does no I/O; the host reads and writes files" },
    { path = "std::fs::write", reason = "core does no I/O; the host reads and writes files" },
]
disallowed-types = [
    { path = "std::fs::File", reason = "core does no I/O; the host reads and writes files" },
    { path = "std::fs::OpenOptions", reason = "core does no I/O; the host reads and writes files" },
    { path = "std::fs::DirBuilder", reason = "core does no I/O; the host reads and writes files" },
    { path = "std::fs::ReadDir", reason = "core does no I/O; the host reads and writes files" },
]
