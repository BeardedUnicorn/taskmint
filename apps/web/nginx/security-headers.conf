# The security headers on every response. Included by the server block and
# again by each location that adds a header of its own, since nginx drops
# the server block's add_header lines in such a location.
#
# style-src allows inline styles: the app's styles are emotion's, injected
# at run time. connect-src also allows Sentry's ingest (VITE_SENTRY_DSN).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.ingest.sentry.io https://*.ingest.us.sentry.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
# For browsers older than CSP's frame-ancestors
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
