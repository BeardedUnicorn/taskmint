<!doctype html>
<!--
  What the browser shows once Google sends it back (google_sign_in.rs fills
  in the parts in double braces). It looks like the web app's sign-in card (AuthLayout),
  in the app's colors (packages/client/src/theme): its light or dark mode
  when the app said which, else the browser's. Everything is inline: the
  listener is gone once the page is sent.
-->
<html lang="en"{{theme}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · TaskMint</title>
<link rel="icon" type="image/png" href="data:image/png;base64,{{favicon}}">
<style>
  :root {
    color-scheme: light;
    --background: #fafafa;
    --paper: #ffffff;
    --text: #3f4e4f;
    --text-secondary: #616161;
    --brand: #65d6a1;
    --brand-hover: #4caf50;
    --on-brand: rgba(0, 0, 0, 0.87);
    --focus: #1f6f4a;
    --done: #1f6f4a;
    --failed: #d32f2f;
    --paper-shadow: 0 1px 3px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.24);
    --logo-light: block;
    --logo-dark: none;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --background: #121212;
    --paper: #1e1e1e;
    --text: #fafafa;
    --text-secondary: #b0b0b0;
    --focus: #65d6a1;
    --done: #65d6a1;
    --failed: #ff5c5c;
    --paper-shadow: 0 1px 3px rgba(0, 0, 0, 0.3), 0 1px 2px rgba(0, 0, 0, 0.4);
    --logo-light: none;
    --logo-dark: block;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      color-scheme: dark;
      --background: #121212;
      --paper: #1e1e1e;
      --text: #fafafa;
      --text-secondary: #b0b0b0;
      --focus: #65d6a1;
      --done: #65d6a1;
      --failed: #ff5c5c;
      --paper-shadow: 0 1px 3px rgba(0, 0, 0, 0.3), 0 1px 2px rgba(0, 0, 0, 0.4);
      --logo-light: none;
      --logo-dark: block;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 16px;
    background: var(--background);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%;
    max-width: 420px;
    padding: 32px;
    border-radius: 12px;
    background: var(--paper);
    box-shadow: var(--paper-shadow);
    text-align: center;
  }
  @media (max-width: 599.95px) {
    main { padding: 24px; }
  }
  .logo { height: 44px; width: auto; margin: 0 auto; }
  .logo-light { display: var(--logo-light); }
  .logo-dark { display: var(--logo-dark); }
  .mark {
    --tone: var(--text-secondary);
    width: 56px;
    height: 56px;
    margin: 28px auto 16px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: var(--tone);
    background: color-mix(in srgb, var(--tone) 14%, transparent);
  }
  .mark svg { width: 32px; height: 32px; fill: currentColor; }
  .done .mark { --tone: var(--done); }
  .failed .mark { --tone: var(--failed); }
  h1 { margin: 0 0 8px; font-size: 1.25rem; font-weight: 600; line-height: 1.4; }
  p { margin: 0; }
  .message { font-size: 1rem; color: var(--text-secondary); }
  .button {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    margin-top: 24px;
    padding: 8px 16px;
    border-radius: 12px;
    background: var(--brand);
    color: var(--on-brand);
    font-size: 0.875rem;
    font-weight: 500;
    line-height: 1.75;
    text-decoration: none;
    box-shadow: 0 3px 1px -2px rgba(0, 0, 0, 0.2), 0 2px 2px 0 rgba(0, 0, 0, 0.14), 0 1px 5px 0 rgba(0, 0, 0, 0.12);
    transition: background-color 250ms, box-shadow 250ms;
  }
  .button:hover {
    background: var(--brand-hover);
    box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.2), 0 4px 5px 0 rgba(0, 0, 0, 0.14), 0 1px 10px 0 rgba(0, 0, 0, 0.12);
  }
  .button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .hint { margin-top: 12px; font-size: 0.875rem; color: var(--text-secondary); }
  @media (prefers-reduced-motion: reduce) {
    .button { transition: none; }
  }
</style>
</head>
<body class="{{outcome}}">
<main>
  <img class="logo logo-light" src="data:image/png;base64,{{logo}}" alt="TaskMint">
  <img class="logo logo-dark" src="data:image/png;base64,{{logo_dark}}" alt="TaskMint">
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="{{icon}}"/></svg>
  </div>
  <h1>{{title}}</h1>
  <p class="message">{{message}}</p>
  <a class="button" href="{{open}}">Open TaskMint</a>
  <p class="hint">You can close this tab.</p>
</main>
<script>
  // The app tries to come forward itself; when the browser keeps the
  // focus (macOS lets it), the browser hands over with the app's link
  setTimeout(function () {
    if (document.hasFocus()) location.href = "{{open}}";
  }, 500);
</script>
</body>
</html>
