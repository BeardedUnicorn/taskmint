[package]
name = "taskmint"
version = "1.0.0"
description = "TaskMint desktop time tracker"
authors = ["Mike Herold"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "taskmint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
taskmint-core = { path = "../../../crates/taskmint-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
url = "2.5"
base64 = "0.22"
uuid = { version = "1.0", features = ["v4"] }
tiny_http = "0.12"
flate2 = "1"
# Failpoints (fail_point!) are no-ops unless the failpoints feature is on;
# the coverage run turns it on to reach errors no real fault can.
fail = "=0.5.1"

[features]
failpoints = ["fail/failpoints"]

[dev-dependencies]
# A mock app, so the data-file tests can run the store plugin TaskMint used
# before P5 and check it reads what the app writes now
tauri = { version = "2", features = ["test"] }
tauri-plugin-store = "2"
# Installs the test logger before any test runs (src/testing.rs)
ctor = "=0.8.0"
