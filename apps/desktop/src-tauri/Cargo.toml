[package]
name = "taskmint"
version = "4.2.4"
description = "TaskMint desktop time tracker"
authors = ["Mike Herold"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "taskmint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
taskmint-core = { path = "../../../crates/taskmint-core" }
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.8"
tauri-plugin-log = "2.10"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
base64 = "0.23"
tiny_http = "0.12"
# Google sign-in for cloud sync (google_sign_in.rs): the token exchange, the
# PKCE challenge, and the random verifier and state
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
sha2 = "0.11"
uuid = { version = "1.0", features = ["v4"] }
flate2 = "1"
# Failpoints (fail_point!) are no-ops unless the failpoints feature is on;
# the coverage run turns it on to reach errors no real fault can.
fail = "=0.5.1"

# Desktop only (Tauri's `desktop` cfg; the code that uses them is behind
# #[cfg(desktop)]). Android and iOS have no second instance to forward to, no
# browser extension sending taskmint:// links, and no updater: the app hides
# what needs them there.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-deep-link = "2.6"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-updater = "2.14"

# Android's Save and Open dialogs pick documents (content:// addresses) that
# only the fs plugin can open (platform/os.rs). A desktop opens paths itself.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-fs = "2.7"
# Only a phone or tablet sets notifications for the system to show later:
# the time one fires at, as the notification plugin takes it (platform/os.rs)
time = "0.3"

[features]
failpoints = ["fail/failpoints"]

[dev-dependencies]
# A mock app, so the data-file tests can run the store plugin TaskMint used
# before P5 and check it reads what the app writes now
tauri = { version = "2.12", features = ["test"] }
tauri-plugin-store = "2.5"
# Installs the test logger before any test runs (src/testing.rs)
ctor = "=0.8.0"
