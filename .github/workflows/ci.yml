name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS: the app's primary platform, and no extra WebKitGTK system
    # packages are needed to compile the Tauri crate.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node scripts/check-coverage-policy.mjs

      - run: node scripts/check-toolchains.mjs

      # Formatting and lint for the TypeScript and JavaScript (biome.jsonc)
      - run: pnpm exec biome ci

      # Sources and tests, every package.
      - run: pnpm typecheck

      # tsc for every package + the desktop vite build. Must run before
      # cargo: tauri::generate_context! embeds apps/desktop/dist.
      - run: pnpm build

      # Load unpacked from the unzipped folder (apps/extension/README.md)
      - uses: actions/upload-artifact@v4
        with:
          name: taskmint-extension
          path: apps/extension/dist/

      - run: pnpm test:coverage

      # The version and components in rust-toolchain.toml (rustup no longer
      # installs it on first use)
      - run: rustup toolchain install

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p taskmint-core --features ts --all-targets -- -D warnings
          cargo clippy -p taskmint --features failpoints --all-targets -- -D warnings

      - name: Contracts match the Rust
        run: scripts/check-contracts.sh

      # The server's tests need Postgres: the docker job runs them
      - name: cargo test
        run: cargo test --workspace --exclude taskmint-server

      - name: taskmint-core coverage (100%)
        run: >-
          cargo llvm-cov -p taskmint-core --summary-only
          --ignore-filename-regex "$(node scripts/check-coverage-policy.mjs --rust-ignore-regex crates/taskmint-core)"
          --fail-under-lines 100 --fail-under-functions 100 --fail-under-regions 100

      - name: desktop shell coverage (100%)
        run: >-
          cargo llvm-cov -p taskmint --features failpoints --summary-only
          --ignore-filename-regex "$(node scripts/check-coverage-policy.mjs --rust-ignore-regex apps/desktop/src-tauri)"
          --fail-under-lines 100 --fail-under-functions 100 --fail-under-regions 100

  docker:
    # Linux, where the images run. The server's own gates run in the compose
    # test profile (its tests need Postgres), then the whole stack is built
    # from scratch and smoke-tested through the web app.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The smoke test is plain Node, with nothing to install
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # The defaults, with the bootstrap admin the smoke test signs in as
      - run: cp .env.example .env

      - name: Server query metadata and tests (100% coverage)
        run: docker compose --profile test run --rm --build server-tests

      - name: Build and start the stack
        run: docker compose up --build -d --wait

      - name: Smoke test
        run: node scripts/smoke.mjs

      - name: Logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose --profile test down -v
