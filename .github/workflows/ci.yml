name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS: the app's primary platform, and no extra WebKitGTK system
    # packages are needed to compile the Tauri crate.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node scripts/check-coverage-policy.mjs

      # Sources and tests, every package.
      - run: pnpm typecheck

      # tsc for every package + the desktop vite build. Must run before
      # cargo: tauri::generate_context! embeds apps/desktop/dist.
      - run: pnpm build

      - run: pnpm test:coverage

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p taskmint-core --features ts --all-targets -- -D warnings
          cargo clippy -p taskmint --features failpoints --all-targets -- -D warnings

      - name: Contracts match the Rust
        run: scripts/check-contracts.sh

      - name: cargo test
        run: cargo test --workspace

      - name: taskmint-core coverage (100%)
        run: >-
          cargo llvm-cov -p taskmint-core --summary-only
          --ignore-filename-regex "$(node scripts/check-coverage-policy.mjs --rust-ignore-regex crates/taskmint-core)"
          --fail-under-lines 100 --fail-under-functions 100 --fail-under-regions 100

      - name: desktop shell coverage (100%)
        run: >-
          cargo llvm-cov -p taskmint --features failpoints --summary-only
          --ignore-filename-regex "$(node scripts/check-coverage-policy.mjs --rust-ignore-regex apps/desktop/src-tauri)"
          --fail-under-lines 100 --fail-under-functions 100 --fail-under-regions 100
